<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback & Guestbook | 박지범 포트폴리오</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* 피드백 페이지 전용 추가 스타일 (메인과 톤앤매너 일치) */
        body {
            background-color: #fafafa;
            color: #111;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px 20px;
        }
        .feedback-container {
            width: 100%;
            max-width: 800px;
            background: #fff;
            border: 1px solid #eaeaea;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
        }
        .feedback-header {
            margin-bottom: 30px;
            text-align: center;
        }
        .feedback-header h2 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }
        .feedback-header p {
            color: #666;
            font-size: 15px;
        }
        #comment-list {
            margin-bottom: 30px;
            max-height: 450px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding-right: 5px;
        }
        .comment-card {
            background: #fdfdfd;
            padding: 18px;
            border-radius: 8px;
            border: 1px solid #eaeaea;
        }
        .comment-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
        }
        .comment-name {
            font-weight: 600;
            color: #222;
        }
        .comment-date {
            color: #888;
            font-size: 12px;
        }
        .comment-text {
            margin: 0;
            font-size: 14px;
            color: #444;
            white-space: pre-wrap;
            line-height: 1.5;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .form-group input, .form-group textarea {
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-group input:focus, .form-group textarea:focus {
            border-color: #111;
        }
        .form-group textarea {
            height: 120px;
            resize: vertical;
        }
        .submit-btn {
            padding: 14px;
            background: #111;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .submit-btn:hover {
            background: #333;
        }
    </style>
</head>
<body>
    <!-- 메인 네비게이션과 동일한 헤더 -->
    <header>
        <div class="logo"><a href="index.html" style="text-decoration:none; color:inherit;">PARK JI BEOM</a></div>
        <nav>
            <ul>
                <li><a href="index.html#about">About</a></li>
                <li><a href="portfolio.html">Portfolio</a></li>
                <li><a href="index.html#contact">Contact</a></li>
                <li><a href="feedback.html" style="font-weight: bold; color: #111;">Feedback</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="feedback-container">
            <div class="feedback-header">
                <h2>Visitor Feedback & Guestbook</h2>
                <p>포트폴리오에 대한 자유로운 피드백이나 방명록을 남겨주세요.</p>
            </div>
            
            <!-- 댓글 목록 영역 -->
            <div id="comment-list">
                <p style="color: #888; text-align: center; padding: 30px;">등록된 코멘트가 없습니다.</p>
            </div>
            
            <!-- 댓글 작성 폼 -->
            <div class="form-group">
                <input type="text" id="comment-name" placeholder="이름 또는 소속 (예: 정석원 교수님 / 디자이너)" />
                <textarea id="comment-text" placeholder="자유로운 피드백이나 내용을 남겨주세요..."></textarea>
                <button id="comment-submit" class="submit-btn">코멘트 남기기</button>
            </div>
        </div>
    </main>

    <footer id="contact" style="padding: 30px 0; text-align: center; border-top: 1px solid #eaeaea;">
        <p style="font-size: 13px; color: #666;">Email: ghenwlwl@naver.com | GitHub: github.com/rich24945316-oss</p>
        <p style="font-size: 13px; color: #888; margin-top: 5px;">© 2026 Park Ji Beom. All rights reserved.</p>
    </footer>

    <!-- 파이어베이스 연동 및 실시간 댓글 스크립트 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-analytics.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDQGe1EsbXFqya417oSEdcbBnc-5SQNMXo",
            authDomain: "portfolio-comments-a845a.firebaseapp.com",
            projectId: "portfolio-comments-a845a",
            storageBucket: "portfolio-comments-a845a.firebasestorage.app",
            messagingSenderId: "959679119040",
            appId: "1:959679119040:web:5c8c4b2396207f6f903725",
            measurementId: "G-SBKTP11T2Q"
        };

        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getFirestore(app);

        const commentList = document.getElementById('comment-list');
        const submitBtn = document.getElementById('comment-submit');
        const nameInput = document.getElementById('comment-name');
        const textInput = document.getElementById('comment-text');

        // 실시간 댓글 목록 불러오기
        const q = query(collection(db, "comments"), orderBy("createdAt", "desc"));
        onSnapshot(q, (snapshot) => {
            commentList.innerHTML = "";
            if (snapshot.empty) {
                commentList.innerHTML = '<p style="color: #888; text-align: center; padding: 30px;">등록된 코멘트가 없습니다.</p>';
                return;
            }
            snapshot.forEach((doc) => {
                const data = doc.data();
                const date = data.createdAt ? new Date(data.createdAt.toDate()).toLocaleString() : '방금 전';
                
                const div = document.createElement('div');
                div.className = 'comment-card';
                div.innerHTML = `
                    <div class="comment-info">
                        <span class="comment-name">${escapeHtml(data.name)}</span>
                        <span class="comment-date">${date}</span>
                    </div>
                    <p class="comment-text">${escapeHtml(data.text)}</p>
                `;
                commentList.appendChild(div);
            });
        });

        // 댓글 등록 이벤트
        submitBtn.addEventListener('click', async () => {
            const name = nameInput.value.trim();
            const text = textInput.value.trim();

            if (!name || !text) {
                alert("이름과 내용을 모두 입력해 주세요!");
                return;
            }

            try {
                await addDoc(collection(db, "comments"), {
                    name: name,
                    text: text,
                    createdAt: serverTimestamp()
                });
                textInput.value = "";
            } catch (e) {
                console.error("댓글 저장 중 에러 발생: ", e);
                alert("저장에 실패했습니다.");
            }
        });

        function escapeHtml(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }
    </script>
</body>
</html>
